[package]
name = "moebius-cpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CPU-only native inference engine for the Moebius 0.22B image-inpainting model"
license = "Apache-2.0"
repository = "https://github.com/CloudyTabzy/moebius-cpu"
publish = false

[lib]
name = "moebius_cpu"
# rlib for the CLI/tests, cdylib for native hosts (C ABI, see include/moebius_cpu.h).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "moebius-cli"
path = "src/bin/moebius-cli.rs"
required-features = ["cli"]

[[bin]]
name = "moebius-convert"
path = "src/bin/moebius-convert.rs"
required-features = ["cli"]

[[example]]
name = "gemm_probe"

[[example]]
name = "profile"
required-features = ["cli"]

[[example]]
name = "eval"
required-features = ["cli"]

[features]
default = []
# Opt-in process allocator: rusty_alloc, a pure-Rust remake of mimalloc. Not the
# default because it does not pay for itself here (tools/bench_alloc.py, 2026-10-29):
# with its defaults it is ~1.5% faster but peaks at 1.99-2.37 GiB
# (over the 1.5 GB gate, it never returns freed memory); with any purge_delay
# (0 ms-10 s) it peaks like the system allocator (~1.39 GiB) and is 0-5% slower.
# The engine's buffer pool already removed the allocation churn it would fix.
rusty-alloc = ["dep:rusty_alloc-api"]
# moebius-cli: PNG in/out + argument parsing. It is also the GIMP plugin's worker.
cli = ["dep:image", "dep:clap", "dep:serde_json", "dep:sha2"]

[dependencies]
# Compute: the GEMM microkernels candle itself uses (runtime AVX2/FMA/AVX-512 dispatch).
gemm = "0.19"
# Multi-threaded GEMMs: faer's current x86 kernels (1.74x gemm on our shapes,
# docs/PLAN.md §4). Pinned: a "private" crate with no semver promise.
private-gemm-x86 = "=0.1.22"
rayon = "1.11"
# Weights: f16 safetensors, memory-mapped, widened to f32 per layer at GEMM time.
safetensors = "0.8"
memmap2 = "0.9"
half = { version = "2.7", features = ["bytemuck"] }
bytemuck = "1"
# Lanczos3 resize for the 512² crop (matches PIL LANCZOS).
fast_image_resize = "6.1"
# Initial latent noise.
rand = "0.10"
rand_distr = "0.6"
thiserror = "2"
# >= 2.2.7: 2.2.1-2.2.4 do not build with MSVC + LTO + panic=unwind (our release
# profile), 2.2.6 fixes a Windows access violation after a purge, 2.2.7 a Windows
# hang at process exit in rayon programs (a plugin process is exactly that).
rusty_alloc-api = { version = "2.2.7", optional = true }
# Physical-core count for the default thread pool size.
num_cpus = "1.17"

image = { version = "0.25", default-features = false, features = ["png"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# Already in the tree via safetensors; the eval runner reads/writes the manifest and times.
serde_json = { version = "1", optional = true }
# Checks downloaded checkpoints in moebius-convert.
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# PNG masks in the ROI parity test (the CLI feature is not needed to run tests).
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Kernels are unusably slow unoptimized; keep tests fast too.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
