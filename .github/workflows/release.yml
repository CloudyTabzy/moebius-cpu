# Pushing a tag like v0.1.0 builds the Windows package and attaches it to a GitHub release.
# The zip is a few MB: the models are downloaded by install.bat, never hosted here.
name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and tests the package without publishing it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --features cli --bins
      - name: Test
        run: cargo test --features cli --lib --bins
      - name: Package
        shell: pwsh
        run: |
          $dir = "moebius-inpaint-gimp-windows"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item gimp-plugin/install.bat, gimp-plugin/moebius-inpaint.py, LICENSE $dir
          Copy-Item target/release/moebius-cli.exe, target/release/moebius-convert.exe $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: moebius-inpaint-gimp-windows
          path: moebius-inpaint-gimp-windows.zip
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} moebius-inpaint-gimp-windows.zip --generate-notes
